<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Bookings | CareRent
  </title>
  <link href="css/app.css" rel="stylesheet"/>
 </head>
 <body class="app-page" data-page="bookings" data-title="Bookings">
  <div class="loading-line" id="globalLoading">
  </div>
  <aside class="app-sidebar" id="appSidebar">
  </aside>
  <div class="app-overlay" id="appOverlay">
  </div>
  <div class="app-content">
   <header class="app-topbar" id="appTopbar">
   </header>
   <main class="main">
    <div class="page-head">
     <div>
      <h1>
       Booking management
      </h1>
      <p>
       Create and manage customer vehicle reservations.
      </p>
     </div>
     <div class="page-actions">
      <button class="btn btn-primary" id="addBooking">
       + New booking
      </button>
     </div>
    </div>
    <div class="grid grid-3" style="margin-bottom:18px">
     <div class="card stat-card">
      <div>
       <div class="stat-label">
        Total bookings
       </div>
       <div class="stat-value" id="bookingTotal">
        —
       </div>
      </div>
      <div class="stat-icon">
       📅
      </div>
     </div>
     <div class="card stat-card">
      <div>
       <div class="stat-label">
        Confirmed
       </div>
       <div class="stat-value" id="bookingConfirmed">
        —
       </div>
      </div>
      <div class="stat-icon success">
       ✓
      </div>
     </div>
     <div class="card stat-card">
      <div>
       <div class="stat-label">
        Pending
       </div>
       <div class="stat-value" id="bookingPending">
        —
       </div>
      </div>
      <div class="stat-icon warning">
       …
      </div>
     </div>
    </div>
    <div class="card">
     <div class="toolbar">
      <div class="toolbar-left">
       <div class="search-wrap">
        <span>
         ⌕
        </span>
        <input id="bookingSearch" placeholder="Search booking or customer" type="search"/>
       </div>
       <select id="bookingStatusFilter" style="width:auto;min-width:155px">
        <option value="">
         All statuses
        </option>
        <option>
         PENDING
        </option>
        <option>
         CONFIRMED
        </option>
        <option>
         CANCELLED
        </option>
       </select>
      </div>
      <div class="toolbar-right">
       <span class="subtle" id="bookingCount">
       </span>
      </div>
     </div>
     <div class="table-wrap">
      <table>
       <thead>
        <tr>
         <th>
          Booking
         </th>
         <th>
          Customer
         </th>
         <th>
          Vehicle
         </th>
         <th>
          Rental period
         </th>
         <th>
          Payment
         </th>
         <th>
          Status
         </th>
         <th>
         </th>
        </tr>
       </thead>
       <tbody id="bookingRows">
       </tbody>
      </table>
      <div id="bookingEmpty">
      </div>
     </div>
    </div>
   </main>
  </div>
  <div class="toast-root" id="toastRoot">
  </div>
  <script defer="" src="js/common.js">
  </script>
  <script defer="" src="js/bookings.js">
  </script>
 </body>
</html>
