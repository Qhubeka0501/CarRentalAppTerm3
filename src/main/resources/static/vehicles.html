<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Vehicles | CareRent
  </title>
  <link href="css/app.css" rel="stylesheet"/>
 </head>
 <body class="app-page" data-page="vehicles" data-title="Vehicles">
  <div class="loading-line" id="globalLoading">
  </div>
  <aside class="app-sidebar" id="appSidebar">
  </aside>
  <div class="app-overlay" id="appOverlay">
  </div>
  <div class="app-content">
   <header class="app-topbar" id="appTopbar">
   </header>
   <main class="main">
    <div class="page-head">
     <div>
      <h1>
       Vehicle management
      </h1>
      <p>
       Track fleet details, pricing, mileage and availability.
      </p>
     </div>
     <div class="page-actions">
      <button class="btn btn-primary" id="addVehicle">
       + Add vehicle
      </button>
     </div>
    </div>
    <div class="card">
     <div class="toolbar">
      <div class="toolbar-left">
       <div class="search-wrap">
        <span>
         ⌕
        </span>
        <input id="vehicleSearch" placeholder="Search make, model or plate" type="search"/>
       </div>
       <select id="vehicleStatusFilter" style="width:auto;min-width:165px">
        <option value="">
         All statuses
        </option>
        <option>
         AVAILABLE
        </option>
        <option>
         RENTED
        </option>
        <option>
         RESERVED
        </option>
        <option>
         UNDER_MAINTENANCE
        </option>
       </select>
      </div>
      <div class="toolbar-right">
       <span class="subtle" id="vehicleCount">
        0 vehicles
       </span>
      </div>
     </div>
     <div class="table-wrap">
      <table>
       <thead>
        <tr>
         <th>
          Vehicle
         </th>
         <th>
          Year / colour
         </th>
         <th>
          Mileage
         </th>
         <th>
          Daily rate
         </th>
         <th>
          Weekly rate
         </th>
         <th>
          Status
         </th>
         <th>
         </th>
        </tr>
       </thead>
       <tbody id="vehicleRows">
       </tbody>
      </table>
      <div id="vehicleEmpty">
      </div>
     </div>
    </div>
   </main>
  </div>
  <div class="toast-root" id="toastRoot">
  </div>
  <script defer="" src="js/common.js">
  </script>
  <script defer="" src="js/vehicles.js">
  </script>
 </body>
</html>
